<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zelda OoT – Checklist</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
  <style>
    :root {
      --bg: #e9dfbf;
      --bg2: #d8c995;
      --card: #f8f0d4;
      --tx: #2b2412;
      --mu: #6e6240;
      --gold: #a8791a;
      --ac: #2f7d3a;
      --on: #cfe9c3;
      --c: #cfe0ff;
      --a: #ffd9bd;
      --bd: #b79c52;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1f15;
        --bg2: #183222;
        --card: #1b3324;
        --tx: #f3ebcf;
        --mu: #b5ab85;
        --gold: #e6b93c;
        --ac: #5fd16f;
        --on: #24502f;
        --c: #22385c;
        --a: #5a3722;
        --bd: #7b6a2c;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1f15;
      --bg2: #183222;
      --card: #1b3324;
      --tx: #f3ebcf;
      --mu: #b5ab85;
      --gold: #e6b93c;
      --ac: #5fd16f;
      --on: #24502f;
      --c: #22385c;
      --a: #5a3722;
      --bd: #7b6a2c;
      color-scheme: dark
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0, var(--bg2), var(--bg) 60%) fixed;
      color: var(--tx);
      font: 16px/1.35 Georgia, serif;
      min-height: 100vh
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--bg2);
      z-index: 20
    }

    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 10;
      background: var(--bg2);
      border-bottom: 3px double var(--gold);
      padding: 8px 12px
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      max-width: 1000px;
      margin: 0 auto
    }

    h1 {
      font: 700 18px Cinzel, Georgia, serif;
      color: var(--gold);
      margin: 0;
      flex: 1;
      min-width: 170px
    }

    button {
      font: inherit;
      color: var(--tx);
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 5px 10px;
      cursor: pointer
    }

    button.on {
      background: var(--gold);
      color: #1b1500;
      border-color: var(--gold)
    }

    #hr {
      flex: 1 1 100%;
      font-size: 16px;
      letter-spacing: 1px
    }

    nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 1000px;
      margin: 8px auto 0
    }

    nav button {
      white-space: nowrap;
      font-size: 14px
    }

    nav small {
      color: var(--mu);
      margin-left: 4px
    }

    nav button.on small {
      color: #1b1500
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 12px 12px 50px
    }

    h2 {
      font: 700 20px Cinzel, Georgia, serif;
      color: var(--gold);
      margin: 4px 0 10px;
      display: flex;
      justify-content: space-between
    }

    h2 small {
      font: 14px Georgia;
      color: var(--mu)
    }

    .g {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px
    }

    .t {
      position: relative;
      background: var(--card);
      border: 2px solid var(--bd);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      min-height: 100px;
      transition: transform .15s
    }

    .t:hover {
      transform: translateY(-2px)
    }

    .t .ic {
      font-size: 30px;
      display: block;
      filter: grayscale(1);
      opacity: .4;
      transition: .25s
    }

    .t .nm {
      font-size: 13px;
      display: block;
      margin-top: 3px;
      font-weight: 700
    }

    .t .lc {
      font-size: 11px;
      display: block;
      color: var(--mu);
      margin-top: 2px
    }

    .t.on {
      background: var(--on);
      border-color: var(--ac)
    }

    .t.on .ic {
      filter: none;
      opacity: 1
    }

    .t.on::after {
      content: "✓";
      position: absolute;
      top: 3px;
      right: 8px;
      color: var(--ac);
      font-weight: 700
    }

    .t.pop {
      animation: pop .6s
    }

    @keyframes pop {
      0% {
        transform: scale(.8)
      }

      40% {
        transform: scale(1.15);
        box-shadow: 0 0 24px var(--gold)
      }

      100% {
        transform: scale(1)
      }
    }

    .tag {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 10px;
      border-radius: 6px;
      padding: 0 4px
    }

    .tag.c {
      background: var(--c)
    }

    .tag.a {
      background: var(--a)
    }

    .cn {
      cursor: default
    }

    .cn .ic {
      filter: none;
      opacity: 1
    }

    .cn b {
      display: block;
      font-size: 20px
    }

    .cn button {
      width: 38px;
      font-size: 18px
    }

    .gs {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--card);
      border: 2px solid var(--bd);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 6px;
      cursor: pointer
    }

    .gs.on {
      background: var(--on);
      border-color: var(--ac)
    }

    .gs.on .ic {
      filter: none;
      opacity: 1
    }

    .gs .ic {
      font-size: 26px;
      filter: grayscale(1);
      opacity: .4
    }

    .gs .tx {
      flex: 1;
      font-size: 14px
    }

    .gs .tx small {
      color: var(--mu);
      display: block
    }

    .gs .n {
      font-size: 11px;
      color: var(--mu)
    }

    .dg {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      background: var(--card);
      border: 2px solid var(--bd);
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 6px
    }

    .dg b {
      flex: 1 1 100%;
      font-size: 14px
    }

    .dg {
      margin: 0 0 6px
    }

    .dg button {
      padding: 8px 12px;
      filter: grayscale(1);
      opacity: .6
    }

    .dg button.on {
      filter: none;
      opacity: 1;
      background: var(--on);
      border-color: var(--ac)
    }

    .ah {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      padding: 10px 12px;
      margin-bottom: 6px
    }

    .ah.ok {
      background: var(--on);
      border-color: var(--ac)
    }

    .ac {
      margin-bottom: 4px
    }

    .fl {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    select {
      font: inherit;
      background: var(--card);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 5px
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 40px);
      opacity: 0;
      background: var(--gold);
      color: #1b1500;
      font: 700 15px Cinzel, Georgia, serif;
      padding: 10px 18px;
      border-radius: 14px;
      transition: .3s;
      z-index: 30;
      pointer-events: none
    }

    #toast.s {
      transform: translate(-50%, 0);
      opacity: 1
    }

    .ft {
      text-align: center;
      color: var(--mu);
      font-size: 13px;
      margin-top: 26px
    }

    @media (max-width:700px) {
      header {
        position: static
      }

      nav button {
        font-size: 13px;
        padding: 4px 8px
      }
    }
  </style>
</head>

      ["Templo del Agua", "Water Temple", 5],
      ["Pozo de Kakariko", "Bottom of the Well", 3],
      ["Templo de las Sombras", "Shadow Temple", 5],
      ["Templo del Espíritu", "Spirit Temple", 5]
    ];
    var C = [
      ["hp", "Piezas de corazón", "Heart Pieces", "💗", 36],
      ["hc", "Contenedores de corazón", "Heart Containers", "❤️", 8]
    ];
    var T = {
      es: {
        ti: "Zelda: Ocarina of Time",
        all: "Todo",
        c: "Niño",
        a: "Adulto",
        rs: "Reiniciar todo",
        rs2: "¿Seguro? Pulsa otra vez",
        nt: "Toca para marcar. Tu progreso se guarda en este navegador.",
        gs: "Skulltulas doradas",
        out: "Fuera de mazmorras",
        ins: "Dentro de mazmorras",
        col: "Coleccionables",
        bug: "Bichos en agujero de judías",
        hide: "Ocultar hechas",
        zon: "Todas las zonas",
        got: "¡Conseguido!"
      },
      en: {
        ti: "Zelda: Ocarina of Time",
        all: "All",
        c: "Child",
        a: "Adult",
        rs: "Reset everything",
        rs2: "Sure? Tap again",
        nt: "Tap to mark. Progress is saved in this browser.",
        gs: "Gold Skulltulas",
        out: "Outside dungeons",
        ins: "Inside dungeons",
        col: "Collectibles",
        bug: "Bugs in a bean patch",
        hide: "Hide done",
        zon: "All zones",
        got: "Got it!"
      }
    };
    var K = "zelda-oot-v2",
      S = {
        d: {},
        g: {},
        w: {},
        n: {},
        o: {},
        l: "es",
        f: "all",
        t: "main",
        s: 1,
        z: "",
        h: 0
      };
    try {
      var r = localStorage.getItem(K);
      if (r) S = Object.assign(S, JSON.parse(r))
    } catch (e) {}

    function save() {
      try {
        localStorage.setItem(K, JSON.stringify(S))
      } catch (e) {}
    }

    function $(i) {
      return document.getElementById(i)
    }
    var armed = false,
      last = "",
      tt, AC;

    function jingle() {
      if (!S.s) return;
      try {
        AC = AC || new(window.AudioContext || window.webkitAudioContext)();
        [784, 740, 698, 622, 415, 440, 622, 659, 831, 1047].forEach(function(f, i) {
          var o = AC.createOscillator(),
            g = AC.createGain();
          o.type = "triangle";
          o.frequency.value = f;
          g.gain.setValueAtTime(.12, AC.currentTime + i * .09);
          g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + i * .09 + .16);
          o.connect(g);
          g.connect(AC.destination);
          o.start(AC.currentTime + i * .09);
          o.stop(AC.currentTime + i * .09 + .18)
        })
      } catch (e) {}
    }

    function toast(n) {
      var e = $("toast");
      e.textContent = "★ " + n + " – " + T[S.l].got;
      e.className = "s";
      clearTimeout(tt);
      tt = setTimeout(function() {
        e.className = ""
      }, 1600)
    }

    function mark(o, k, name) {
      if (o[k]) delete o[k];
      else {
        o[k] = 1;
        last = k;
        jingle();
        toast(name)
      }
      save();
      render()
    }

    function nm(p, L) {
      return L === "es" ? p[0] : p[1]
    }

    function stats() {
      var r = {};
      D.forEach(function(s) {
        var c = 0,
          n = 0;
        s[4].forEach(function(it, i) {
          var a = it.split("|")[3];
          if (S.f !== "all" && a !== "b" && a !== S.f) return;
          n++;
          if (S.d[s[0] + i]) c++
        });
        r[s[0]] = [c, n]
      });
      var gc = 0,
        gn = 0;
      G.forEach(function(x, i) {
        if (S.f !== "all" && x[1] !== S.f) return;
        gn++;
        if (S.g[i]) gc++
      });
      W.forEach(function(w, i) {
        for (var j = 0; j < w[2]; j++) {
          gn++;
          if (S.w[i + "_" + j]) gc++
        }
      });
      r.gs = [gc, gn];
      return r
    }

    function render() {
      var Y = window.scrollY,
        L = S.l,
        t = T[L],
        m = $("m"),
        st = stats(),
        tot = 0,
        dn = 0;
      document.documentElement.lang = L;
      m.innerHTML = "";
      for (var k in st) {
        tot += st[k][1];
        dn += st[k][0]
      }
      var pc = tot ? Math.round(dn / tot * 100) : 0,
        h = Math.round(pc / 10),
        hs = "";
      for (var i = 0; i < 10; i++) hs += i < h ? "❤️" : "🖤";
      $("ti").textContent = "🗡️ " + t.ti + " · " + pc + "%";
      $("hr").textContent = hs;
      $("lg").textContent = L === "es" ? "🌐 EN" : "🌐 ES";
      $("sn").textContent = S.s ? "🔊" : "🔇";
      [
        ["fl", "all"],
        ["fc", "c"],
        ["fa", "a"]
      ].forEach(function(p) {
        var b = $(p[0]);
        b.textContent = (p[1] === "c" ? "🧒 " : p[1] === "a" ? "🧑 " : "") + t[p[1]];
        b.className = S.f === p[1] ? "on" : ""
      });
      $("rs").textContent = armed ? t.rs2 : t.rs;
      $("nt").textContent = t.nt;
      var nv = $("nv"),
        sc = nv.scrollLeft;
      nv.innerHTML = "";
      D.concat([
        ["gs", t.gs, t.gs, "🕷️"],
        ["col", t.col, t.col, "📦"]
      ]).forEach(function(s) {
        var b = document.createElement("button"),
          q = st[s[0]],
          nme = s[0] === "gs" || s[0] === "col" ? s[1] : (L === "es" ? s[1] : s[2]);
        b.className = S.t === s[0] ? "on" : "";
        b.innerHTML = s[3] + " " + nme + (q ? "<small>" + (q[1] && q[0] === q[1] ? "✅ " : "") + q[0] + "/" + q[1] +
          "</small>" : "");
        b.onclick = function() {
          S.t = s[0];
          save();
          render();
          scrollTo(0, 0)
        };
        nv.appendChild(b)
      });
      nv.scrollLeft = sc;
      var cur = D.filter(function(s) {
        return s[0] === S.t
      })[0];
      if (cur) {
        var q = st[cur[0]];
        m.innerHTML = "<h2><span>" + cur[3] + " " + (L === "es" ? cur[1] : cur[2]) + "</span><small>" + (q[1] && q[
          0] === q[1] ? "✅ " : "") + q[0] + "/" + q[1] + "</small></h2>";
        var g = document.createElement("div");
        g.className = "g";
        cur[4].forEach(function(it, i) {
          var p = it.split("|"),
            a = p[3],
            key = cur[0] + i;
          if (S.f !== "all" && a !== "b" && a !== S.f) return;
          var d = document.createElement("div"),
            on = S.d[key];
          d.className = "t" + (on ? " on" : "") + (last === key ? " pop" : "");
          d.innerHTML = (a !== "b" ? '<span class="tag ' + a + '">' + (a === "c" ? "🧒" : "🧑") + "</span>" : "") +
            '<span class="ic">' + p[2] + '</span><span class="nm">' + (L === "es" ? p[0] : p[1]) + "</span>" + (p[
              4] ? '<span class="lc">📍 ' + (L === "es" ? p[4] : p[5]) + "</span>" : "");
          d.onclick = function() {
            mark(S.d, key, nm(p, L))
          };
          g.appendChild(d)
        });
        m.appendChild(g)
      } else if (S.t === "gs") {
        m.innerHTML = "<h2><span>🕷️ " + t.gs + "</span><small>" + (st.gs[0] === st.gs[1] ? "✅ " : "") + st.gs[0] +
          "/" + st.gs[1] + "</small></h2>";
        var f = document.createElement("div");
        f.className = "fl";
        var hb = document.createElement("button");
        hb.textContent = "👁️ " + t.hide;
        hb.className = S.h ? "on" : "";
        hb.onclick = function() {
          S.h = S.h ? 0 : 1;
          save();
          render()
        };
        f.appendChild(hb);
        m.appendChild(f);

        function acc(key, title, total, done, body) {
          var w = document.createElement("div");
          w.className = "ac";
          var h = document.createElement("button"),
            ok = total && done === total,
            op = S.o[key];
          h.className = "ah" + (ok ? " ok" : "");
          h.innerHTML = "<span>" + (op ? "▼" : "▶") + " " + title + "</span><span>" + (ok ? "✅ " : "") + done + "/" +
            total + "</span>";
          h.onclick = function() {
            S.o[key] = op ? 0 : 1;
            save();
            render()
          };
          w.appendChild(h);
          if (op) w.appendChild(body());
          m.appendChild(w)
        }
        var o = document.createElement("h2");
        o.innerHTML = "<span>" + t.out + "</span>";
        m.appendChild(o);
        Object.keys(Z).forEach(function(z) {
          var ix = [],
            dn2 = 0;
          G.forEach(function(x, i) {
            if (x[0] === z && (S.f === "all" || x[1] === S.f)) {
              ix.push(i);
              if (S.g[i]) dn2++
            }
          });
          if (!ix.length || (S.h && dn2 === ix.length)) return;
          acc("z" + z, "📍 " + Z[z][L === "es" ? 0 : 1], ix.length, dn2, function() {
            var c = document.createElement("div");
            ix.forEach(function(i) {
              var x = G[i];
              if (S.h && S.g[i]) return;
              var d = document.createElement("div"),
                tx = x[2] ? (L === "es" ? x[2] : x[3]) : t.bug;
              d.className = "gs" + (S.g[i] ? " on" : "") + (last === "g" + i ? " pop" : "");
              d.innerHTML = '<span class="ic">🕷️</span><span class="tx">' + tx +
                '</span><span class="tag" style="position:static;background:var(--' + x[1] + ')">' + (x[
                  1] === "c" ? "🧒" : "🧑") + '</span><span class="n">#' + (i + 1) + "</span>";
              d.onclick = function() {
                mark(S.g, i, tx)
              };
              c.appendChild(d)
            });
            return c
          })
        });
        var o2 = document.createElement("h2");
        o2.innerHTML = "<span>" + t.ins + "</span>";
        m.appendChild(o2);
        W.forEach(function(w, i) {
          var dn3 = 0,
            nme = L === "es" ? w[0] : w[1];
          for (var j = 0; j < w[2]; j++)
            if (S.w[i + "_" + j]) dn3++;
          acc("w" + i, "🏰 " + nme, w[2], dn3, function() {
            var d = document.createElement("div");
            d.className = "dg";
            for (var j = 0; j < w[2]; j++)(function(j) {
              var b = document.createElement("button"),
                k = i + "_" + j;
              b.className = S.w[k] ? "on" : "";
              b.textContent = "🕷️ " + (j + 1);
              b.onclick = function() {
                mark(S.w, k, nme + " #" + (j + 1))
              };
              d.appendChild(b)
            })(j);
            return d
          })
        })
      } else {
        m.innerHTML = "<h2><span>📦 " + t.col + "</span></h2>";
        var cg = document.createElement("div");
        cg.className = "g";
        C.forEach(function(c) {
          var v = S.n[c[0]] || 0,
            d = document.createElement("div");
          d.className = "t cn";
          d.innerHTML = '<span class="ic">' + c[3] + '</span><span class="nm">' + (L === "es" ? c[1] : c[2]) +
            "</span><b>" + v + " / " + c[4] + "</b><button>−</button> <button>+</button>";
          var b = d.querySelectorAll("button");
          b[0].onclick = function() {
            S.n[c[0]] = Math.max(0, v - 1);
            save();
            render()
          };
          b[1].onclick = function() {
            S.n[c[0]] = Math.min(c[4], v + 1);
            if (v < c[4]) jingle();
            save();
            render()
          };
          cg.appendChild(d)
        });
        m.appendChild(cg)
      }
      last = "";
      window.scrollTo(0, Y)
    }
    $("lg").onclick = function() {
      S.l = S.l === "es" ? "en" : "es";
      save();
      render()
    };
    $("sn").onclick = function() {
      S.s = S.s ? 0 : 1;
      save();
      render()
    };
    [
      ["fl", "all"],
      ["fc", "c"],
      ["fa", "a"]
    ].forEach(function(p) {
      $(p[0]).onclick = function() {
        S.f = p[1];
        save();
        render()
      }
    });
    $("rs").onclick = function() {
      if (!armed) {
        armed = true;
        render();
        setTimeout(function() {
          armed = false;
          render()
        }, 4000);
        return
      }
      armed = false;
      S.d = {};
      S.g = {};
      S.w = {};
      S.n = {};
      S.o = {};
      save();
      render()
    };
    render();
  </script>
</body>

</html>
